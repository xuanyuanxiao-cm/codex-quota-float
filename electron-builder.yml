appId: com.openai.codex-quota-float
productName: Codex Quota Float

files:
  - dist/**/*
  - assets/**/*
  - package.json

asar: true

directories:
  output: release

win:
  icon: assets/codex-quota-float.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Codex Quota Float Setup ${version}.exe
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: Codex Quota Float Portable ${version}.exe
