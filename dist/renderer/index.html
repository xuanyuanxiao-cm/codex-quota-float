<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Quota</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="./notice-presentation.js" defer></script>
    <script src="./renderer.js" defer></script>
  </head>
  <body>
    <main class="quota-app is-collapsed" data-quota-app data-state="collapsed">
      <section class="orb-shell" aria-label="Codex quota">
        <div class="alert-summary" data-alert-summary hidden aria-live="polite"></div>
        <div class="orb-stack">
        <button class="orb" type="button" data-action="toggle-pin" aria-expanded="false" aria-label="Open quota details">
          <span class="ring ring--weekly" data-window="weekly" role="img" aria-label="Weekly remaining"></span>
          <span class="ring ring--five-hour" data-window="five-hour" role="img" aria-label="Five-hour remaining"></span>
          <span class="orb-center" aria-hidden="true">
            <span data-center="five-hour">…</span>
            <span class="center-divider"></span>
            <span data-center="weekly">…</span>
          </span>
        </button>
          <button class="orb-alert alert-low" data-orb-low hidden type="button" aria-label="查看额度警告">!</button>
          <button class="orb-alert alert-notice" data-orb-notice hidden type="button" aria-label="查看未读消息">0</button>
          <button class="orb-alert alert-recovered" data-orb-recovered hidden type="button" aria-label="查看额度恢复详情">✓</button>
          <button class="orb-alert alert-expiring" data-orb-expiring hidden type="button" aria-label="查看即将过期的重置卡"><span class="clock-icon" aria-hidden="true"></span></button>
        </div>
        <p class="accessible-status" data-accessible-status aria-live="polite">5 Hours 刷新中…. Weekly 刷新中….</p>
      </section>

      <button class="probability-tag" data-probability-tag hidden title="未来 24 小时额外重置公告 · 实验性估计">重置 —</button>
      <section class="details" data-details aria-label="Quota details">
        <div class="details-heading">
          <span data-plan>正在识别套餐…</span>
          <button class="refresh" type="button" data-action="refresh">Refresh</button>
        </div>
        <div class="window-row" data-detail-window="five-hour">
          <span>5 Hours</span><strong data-value="five-hour">刷新中…</strong>
          <span class="reset-timing">
            <span data-countdown="five-hour">刷新中…</span>
            <span class="reset-at" data-reset-at="five-hour" hidden></span>
          </span>
        </div>
        <p class="quota-alert alert-low" data-alert-window="fiveHour" hidden></p>
        <div class="window-row" data-detail-window="weekly">
          <span>Weekly</span><strong data-value="weekly">刷新中…</strong>
          <span class="reset-timing">
            <span data-countdown="weekly">刷新中…</span>
            <span class="reset-at" data-reset-at="weekly" hidden></span>
          </span>
        </div>
        <p class="quota-alert alert-low" data-alert-window="weekly" hidden></p>
        <div class="reset-row">
          <span>Resets</span><strong data-reset-count>—</strong><button class="reset" type="button" data-action="reset" disabled>Reset</button>
        </div>
        <button class="expiry-summary" data-action="expiring-credits" hidden><span class="clock-icon" aria-hidden="true"></span><span data-expiry-summary></span></button>
        <section class="credit-picker" data-credit-picker aria-label="选择重置卡" hidden>
          <div class="credit-picker-heading"><strong>选择重置卡</strong><button type="button" data-action="cancel-reset" aria-label="关闭选卡列表">×</button></div>
          <p>默认选择最快过期的卡，也可以手动更换。</p>
          <div class="credit-list" data-credit-list role="group" aria-label="可用重置卡"></div>
          <div class="credit-picker-footer">
            <span data-picker-selection aria-live="polite"></span>
            <span class="credit-error" data-credit-error role="alert" hidden></span>
            <button class="credit-confirm" type="button" data-action="confirm-reset">确认重置</button>
          </div>
        </section>
        <p class="status-note" data-note hidden></p>
        <p class="last-updated" data-last-updated hidden></p>
        <section class="probability-panel" data-probability-panel>
          <button class="probability-summary" data-action="notice-detail"><span><span data-probability-heading>社区预测 · 未来 24h</span><strong data-probability-value>—</strong></span><small data-probability-note>等待社区数据</small></button>
          <button class="notice-source" data-notice-source type="button" title="在浏览器打开对应 X 原帖" hidden>原文 ↗</button>
        </section>
        <button class="notice-button" data-action="notices"><span>≡ 重置动态</span><span data-notice-summary>读取中…</span></button>
        <button class="tibo-button" data-action="tibo"><span>Tibo 动态 <b data-tibo-badge hidden></b></span><small data-tibo-summary>最近 30 天 · 中文阅读</small></button>
        <button class="trends-button" data-action="trends">▥ 用量趋势 ↗</button>
      </section>

      <button class="edge-handle" type="button" data-action="restore-from-edge" aria-label="显示悬浮球">
        <span aria-hidden="true"></span>
      </button>
    </main>
  </body>
</html>
